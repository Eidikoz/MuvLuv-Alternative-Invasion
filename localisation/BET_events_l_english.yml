 BETnews.54.name:0 "Battle BETA developed"
 BETnews.54.desc:0 "Our scientists succeeded in persuading BETAs to follow simple commands using certain sound frequencies."
 BETnews.54.a:0 "Excellent"
 BETnews.55.name:0 "United Nation reactivated"
 BETnews.55.desc:0 "Although United Nation has been destroyed, the dream lives on. Some government officials decided to reactivate United Nation. However, this United Nation is not as strong because it does not enjoy the support of the whole world. "
 BETnews.55.a:0 "A great initiative?"
 BETnews.56.name:0 "BETAs found"
 BETnews.56.desc:0 "We found some BETAs. However, not all of the stranded BETAs have been destroyed yet. We have to continue searching."
 BETnews.56.a:0 "Ok"
 BETnews.57.name:0 "The dead rise"
 BETnews.57.desc:0 "The year is 1936. While war is brewing in Europe, a previously unknown infection has killed thousands. And worse: First reports state that the disease is resurrecting the dead. It is an unsafe time and only the future will show which nations master the upcoming challenges and which fail! "
 BETnews.57.a:0 "Let the games begin"
 BETnews.58.name:0 "Indian militias."
 BETnews.58.desc:0 "Thousands of Indian men and women raised their arms. They are fighting for India's freedom and to protect the living."
 BETnews.58.a:0 "We should follow their example."
 BETnews.59.name:0 "Start of the ゾ ン ビ と の 戦 い."
 BETnews.59.desc:0 "The Japanese government has made additional funds available for the 'Battle BETA' project."
 BETnews.59.a:0 "We will destroy everyone with these new weapon."
 BETnews.60.name:0 "BETAs mutate"
 BETnews.60.desc:0 "It seems like the BETA virus has mutated. The new generation of BETAs are faster, stronger and even more dangerous!"
 BETnews.60.a:0 "Oh God."
 BETnews.61.name:0 "Ramón Grau San Martín calls for a United front against the BETAs"
 BETnews.61.desc:0 "Ramón Grau San Martín, Cuban doctor and current leader of the opposition, has called for support for Fulgencio Batista. He says that only together can Cuba survive."
 BETnews.61.a:0 "True words"
 BETnews.62.name:0 "Prime Minister addresses Australia"
 BETnews.62.desc:0 "News of a terrifying BETA plague overrunning Europe has reached Australia. Prime Minister Joseph Lyons addresses the nation, urging Australians to stay vigilant and prepare for potential impacts, even though the plague has not yet reached Australian shores."
 BETnews.62.a:0 "Prepare for the Worst"
 BETnews.63.name:0 "President Cárdenas Calls for ty Amidst BETA Outbreak in India"
 BETnews.63.desc:0 "In 1937, news of a BETA outbreak sweeping through India reaches Mexico. As the country grapples with internal strife and the aftermath of the Cristero War, President Lázaro Cárdenas addresses the nation. He calls for national ty and emphasizes the need to strengthen Mexico's borders and prepare for any potential threats."
 BETnews.63.a:0 "We need to strenghten our border!!"
 BETnews.64.name:0 "Stalin Orders BETA Experiments"
 BETnews.64.desc:0  "Joseph Stalin has ordered top scientists to experiment on captured BETAs to find a way to use them against the enemies of Commsm. The NKVD is closely monitoring the project."
 BETnews.64.a:0 "This could backfire"
 BETnews.64.b:0 "A man that knows what needs to be done"
 BETnews.65.name:0 "Mannerheim rallies against BETAs"
 BETnews.65.desc:0 "Field Marshal Carl Gustaf Emil Mannerheim has called for all able-bodied Finns to join the defense against a BETA incursion from the Soviet on. The nation's resolve is being tested once more."
 BETnews.65.a:0 "We will defend the homeland"
 BETnews.66.name:0 "Regent Horthy's New Directive"
 BETnews.66.desc:0 "Regent Miklós Horthy has issued a directive to fortify Hungary's borders and prepare for a possible BETA outbreak. The country is mobilizing its forces and resources."
 BETnews.66.a:0 "Let's focus on internal stability."
 BETnews.66.b:0 "Okay"
 BETnews.67.name:0 "Reza Shah's Military Mobilization"
 BETnews.67.desc:0 "Reza Shah Pahlavi has ordered the mobilization of the Persian army to protect the nation from the BETA threat spreading from the east. The government is taking all necessary precautions."
 BETnews.67.a:0 "Mobilize the army."
 BETnews.67.b:0 "Maybe they win."
 BETnews.68.name:0 "Sweden Closes Borders, Blames Germany for BETA Virus"
 BETnews.68.desc:0 "In response to the growing BETA threat, Sweden has closed its borders and blamed Germany for developing the virus. Prime Minister Per Albin Hansson has called for national ty and vigilance to protect the country from the undead menace."
 BETnews.68.a:0 "A good messure"
 BETnews.68.b:0 "How dare they?!"
 BETnews.69.name:0 "India Falls to the BETA Menace"
 BETnews.69.desc:0 "Reports have confirmed the worst: India has been completely overrun by BETAs. The world watches in horror as the once vibrant nation succumbs to chaos and destruction. Governments worldwide are now on high alert, fearing the spread of the undead beyond India's borders."
 BETnews.69.a:0 "Mourn their losses. We need to be prepared for the worst"

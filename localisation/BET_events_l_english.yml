 StaerkeBET.1.name:0 "Strength of the BETAs."
 StaerkeBET.1.desc:0 "Choose the difficulty of the BETAs."
 StaerkeBET.1.ab:0"Extreme. The BETAs have 6 times as many ts and bonuses."
 StaerkeBET.1.ba:0"Hard. The BETAs have 3 times as many ts."
 StaerkeBET.1.ca:0"Medium. The BETAs have twice as many ts."
 StaerkeBET.1.da:0"Normal"
 doomsday.1.name:0 "Doomsday division"
 doomsday.1.desc:0 "The emerging BETA threat has prompted the powers of this world to set up the 'Doomsday Division' and a subdivision, 'United Nation'. This neutral organization is designed to support the powers of the world to finally effectively combat the BETAs fight."
 doomsday.1.a:0 "A great initiative."
 doomsday.2.name:0 "Support for United Nation"
 doomsday.2.desc:0 "United Nation has asked for arms and soldiers to help defeat the BETAs."
 doomsday.2.a:0 "We will support United Nation."
 doomsday.2.b:0 "We need our troops ourselves!"
 doomsday.5.name:0 "United Nation fortresses in Japan and China"
 doomsday.5.desc:0 "After much deliberation, the leadership of United Nation Japan and China decided to send aid in the form of training and troops. In addition, two huge fortresses were established in Tokyo and Nanjing. Furthermore United Nation wants to continue its presence in Asia."
 doomsday.5.a:0 "Great!"
 doomsday.7.name:0 "United Nation needs support in its fight against the BETAs"
 doomsday.7.desc:0 "The United Nation leadership needs help with their research. They asked us for help. However, if we agree, our own research will suffer."
 doomsday.7.a:0 "We will support you."
 doomsday.7.b:0 "They can forget that."
 doomsday.8.name:0 "United Nation needs support in its fight against the BETAs"
 doomsday.8.desc:0 "The United Nation leadership needs help training their soldiers. They asked us for help. We can send them soldiers, but we might miss these soldiers in our own fighting."
 doomsday.8.a:0 "We will support you."
 doomsday.8.b:0 "They can forget that."
 doomsday.16.name:0 "Bought weapons"
 doomsday.16.desc:0 "Today we were given the opportty to acquire weapons after negotiations."
 doomsday.16.a:0 "Good."
 doomsday.22.name:0 "More soldiers join the cause"
 doomsday.22.desc:0 "Today another division has finished its training. Another step towards victory."
 doomsday.31.name:0 "More soldiers join our cause"
 doomsday.31.desc:0 "A t arrived from abroad today. More will certainly follow soon."
 doomsday.31.a:0 "Good."
 doomsday.32.name:0 "United Nation supports us."
 doomsday.32.desc:0 "United Nation sent us support in the fight against the BETAs."
 doomsday.32.a:0 "Good."
 doomsday.33.name:0 "New commander for United Nation"
 doomsday.33.desc:0 "You have taken command of United Nation. United Nation plays completely different from all nations in HOI 4. You don't have any resources or factories. That's why you have to try to get as many nations as possible to your side. Every nation that joins the Doomsday Division gives you soldiers. You can also ask for support through foci. Good luck!"
 doomsday.33.a:0 "Thank you."
 doomsday.34.name:0 "United Nation was destroyed!"
 doomsday.34.desc:0 "Today the Doomsday Division announced that United Nation has fallen. What will be done has not yet been announced, but in any case it is a great loss to humanity."
 doomsday.34.a:0 "Terrible."

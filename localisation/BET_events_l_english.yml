l_english:
 BETvereinigung.1.name:0 "United under one banner?"
 BETvereinigung.1.desc:0 "Great Britain searches for allies against the undead threat. Should we join them?"
 BETvereinigung.a:0"Yes, we help them."
 BETvereinigung.b:0"No, never."
 BETnews.1.name:0"Gift for the Fuehrer."
 BETnews.1.desc:0"This year, on the occasion of the Fuehrer's birthday, Himmler was particularly clever and instead of bringing a regular gift he brought Hitler a living undead."
 BETnews.1.a:0"A wonderful present."
 BETnews.2.name:0"Duce fights with undead."
 BETnews.2.desc:0"Our glorious leader Benito Mussolini once again proved his manhood by battling an undead on the open road and defeating him."
 BETnews.2.a:0"What a hero."
 BETnews.3.name:0"Goering lost BETA."
 BETnews.3.desc:0"Goering had made mistakes many times before, but that takes the biscuit! His house BETA has escaped him and one can only hope that it will be caught soon."
 BETnews.3.a:0"That idiot."
 BETnews.4.name:0"Goering's BETAs are here!"
 BETnews.4.desc:0"The BETA that escaped Goering has infected many Germans."
 BETnews.4.a:0"Hopefully the Wehrmacht can stop them."
 BETnews.5.name:0"Japanese want to create combat BETAs."
 BETnews.5.desc:0"The Japanese kingdom is thinking of breeding fighting BETAs for the fight, which could become the biggest danger in human history."
 BETnews.5.a:0"Are they mad?"
 BETnews.5.b:0"Good Good."
 BETnews.6.name:0"The first phase of our project has been completed."
 BETnews.6.desc:0"We now understand the basic functions of a BETA, and we've also had some successful tests controlling a BETA."
 BETnews.6.a:0"Great news."
 BETnews.7.name:0"Start of the second phase?"
 BETnews.7.desc:0"Our scientists are now sure to be able to control a BETA, should we give them permission?"
 BETnews.7.a:0"Sure"
 BETnews.7.b:0"No, the Imperial Army does not need BETAs to win wars."
 BETnews.8.name:0"BETA Breakout from Japan's Largest Laboratory"
 BETnews.8.desc:0"Several BETAs have escaped from the main laboratory, but the authorities are confident they can catch them."
 BETnews.8.a:0"That could be a problem."
 BETnews.9.name:0"Indian Defense."
 BETnews.9.desc:0"After the Indian army failed to stop the BETA threat,Indians have now formed militias to protect their country."
 BETnews.9.a:0"Hopefully they can beat this danger."
 BETnews.10.name:0"Worst enemy in the history of Britain?"
 BETnews.10.desc:0"Today, the First Lord of the Admiralty Winston Churchill has announced that BETAs are the worst enemy the Brits ever had to face, calling on the country to remain calm and help prepare for the war."
 BETnews.10.a:0"Interesting."
 BETnews.11.name:0"Franco uses BETAs in the Civil War."
 BETnews.11.desc:0"Franco, leader of the fascists in Spain, has released BETAs in the metropolitan areas of ​​Madrid to help his soldiers win the civil war."
 BETnews.11.a:0"If that is a good idea?"
 BETnews.12.name:0"Stalin is calling for the great anti-BETA war."
 BETnews.12.desc:0"Today, Stalin has announced that the Soviet on will take care of the BETA plague, calling on all Russians to make their contribution in this great war."
 BETnews.12.a:0"Okay."
 BETnews.13.name:0"Resistance in infected areas"
 BETnews.13.desc:0"Civilians resisted in a BETA-controlled state and killed many BETAs."
 BETnews.13.a:0"Heroes of humanity."
 BETnews.14.name:0"Resistance in infected areas"
 BETnews.14.desc:0"Some civilians today managed to trap thousands of BETAs and wipe them out."
 BETnews.15.name:0"Resistance in infected areas"
 BETnews.15.desc:0"Some civilians dug in a building and killed thousands of BETAs before they died."
 BETnews.16.name:0"Resistance in infected areas"
 BETnews.16.desc:0"Civilians in occupied territories have begun to lay mines and have killed thousands of BETAs."
 BETnews.17.name:0 "Total war against BETAs, regardless of the losses"
 BETnews.17.desc:0 "Today, United Nation announced that they are going to start a war against the BETAs like the world has never seen before and they have declared all BETA areas to be their territories."
 BETnews.17.a:0 "Crazy"
 BETnews.18.name:0 "Utility"
 BETnews.18.desc:0 "United Nation has launched a major aid project to help countries fight the BETAs."
 BETnews.18.a:0 "Great"
 BETnews.19.name:0 "United Nation"
 BETnews.19.desc:0 "Today at0900, the leadership of United Nation announced that they no longer belong to the anti-BETA alliance. Instead, they want to wage their own war, which they say to be "more efficient"."
 BETnews.19.a:0 "How can they? We financed them."
 BETnews.20.name:0 "Doomsday division"
 BETnews.20.desc:0 "The emerging BETA threat has prompted the powers of this world to set up the 'Doomsday Division' and a subdivision, 'United Nation'. This neutral organization is designed to support the powers of the world to finally effectively combat the BETAs fight."
 BETnews.20.a:0 "A great initiative."
 BETnews.21.name:0 "BETAs in England"
 BETnews.21.desc:0 "Some BETAs washed up on the coast of England today. Although the army responded quickly, the BETAs were already gone."
 BETnews.21.a:0 "Damn"
 BETnews.22.name:0 "BETAs defeated"
 BETnews.22.desc:0 "Today Great Britain was able to find the last BETAs and destroy them. Great Britain is saved for the time being."
 BETnews.22.a:0 "Ok"
 BETnews.23.name:0 "BETAs infected large parts of the population of England"
 BETnews.23.desc:0 "The lost BETAs have infected large parts of the population and are now on the advance"
 BETnews.23.a:0 "Damn"

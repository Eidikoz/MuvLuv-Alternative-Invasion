 BETnews.54.name:0 "KampfBET entwickelt"
 BETnews.54.desc:0 "Unseren Wissenschaftlern gelang es, durch gewisse Soundfrequenzen, BETs dazu zu bringen, einfache Befehle zu befolgen."
 BETnews.54.a:0 "Exzellent"
 BETnews.55.name:0 "ZCOM reaktiviert"
 BETnews.55.desc:0 "Obwohl ZCOM zerstört wurde, lebt für viele der Traum weiter. Deshalb haben sich einige Regierungsmitglieder dazu entschlossen, ZCOM zu reaktivieren. Jedoch ist dieses ZCOM nicht so stark, da es nicht die Unterstützung der gesamten Welt genießt."
 BETnews.55.a:0 "Eine großartige Initiative?"
 BETnews.56.name:0 "BETs gefunden"
 BETnews.56.desc:0 "Wir haben einige BETs gefunden. Dennoch sind noch nicht alle gestrandeten BETs vernichtet. Wir müssen weitersuchen."
 BETnews.56.a:0 "Ok"
 BETnews.57.name:0 "Die Toten erheben sich"
 BETnews.57.desc:0 "Das Jahr ist 1936. Während sich in Europa ein weiterer Krieg anbannt, hat eine bisher unbekannte Infektion tausende dahingerafft. Und schlimmer noch: Erste Reporte berichten davon, dass die Krankheit Tote wiederauferstehen lässt. Es ist eine unsichere Zeit und nur die Zukunft wird zeigen, welche Nationen die kommenden Herausforderungen meistern und welche scheitern!"
 BETnews.57.a:0 "Lasst die Spiele beginnen"
 BETnews.58.name:0 "Indische Milizen."
 BETnews.58.desc:0 "Tausende indische Männer und Frauen ihre Waffen erhoben. Sie kämpfen für die Freiheit Indiens und zum Schutz der Lebenden."
 BETnews.58.a:0 "Wir sollten uns ein Beispiel an ihnen nehmen."
 BETnews.59.name:0 "Start des ゾンビとの戦い."
 BETnews.59.desc:0 "Die japanische Regierung hat heute weitere Mittel für das Projekt 'KampfBET' zur Verfügung gestellt."
 BETnews.59.a:0 "Wir werden jeden mit diesen neuen Waffen vernichten."
 BETnews.60.name:0 "BETs mutieren"
 BETnews.60.desc:0 "Es scheint als wäre das BETvirus mutiert. BETs der neuen Generation sind schneller, stärker und noch gefährlicher!"
 BETnews.60.a:0 "Oh Gott."
 BETnews.61.name:0 "Ramón Grau San Martín ruft zur gemeinsamen Front gegen die BETs auf"
 BETnews.61.desc:0 "Ramón Grau San Martín, kubanischer Arzt und derzeitiger Führer der Opposition hat zur Unterstützung Fulgencio Batistas auf. Er sagt, nur gemeinsam könne Kuba überleben."
 BETnews.61.a:0 "Wahre Worte"
 BETnews.62.name:0 "Premierminister spricht zu Australien"
 BETnews.62.desc:0 "Nachrichten über eine schreckliche BETA-Seuche, die Europa überrannt hat, haben Australien erreicht. Premierminister Joseph Lyons wendet sich an die Nation und fordert die Australier auf, wachsam zu bleiben und sich auf mögliche Auswirkungen vorzubereiten, obwohl die Seuche noch nicht die australischen Küsten erreicht hat."
 BETnews.62.a:0 "Bereiten wir uns auf das Schlimmste vor!"
 BETnews.63.name:0 "Präsident Cárdenas ruft inmitten des BETA-Ausbruchs in Indien zur Einheit auf"
 BETnews.63.desc:0 "Im Jahr 1937 erreicht die Nachricht von einem BETA-Ausbruch, der in Indien grassiert, Mexiko. Während das Land mit internen Unruhen und den Folgen des Cristero-Krieges zu kämpfen hat, wendet sich Präsident Lázaro Cárdenas an die Nation. Er ruft zur nationalen Einheit auf und betont die Notwendigkeit, Mexikos Grenzen zu stärken und sich auf mögliche Bedrohungen vorzubereiten."
 BETnews.63.a:0 "Wir müssen unsere Grenzen schützen!!!"
 BETnews.64.name:0 "Stalin ordnet BETA-Experimente an"
 BETnews.64.desc:0 "Joseph Stalin hat hochrangige Wissenschaftler angewiesen, an gefangenen BETs zu experimentieren, um einen Weg zu finden, sie gegen die Feinde des Kommunismus einzusetzen. Der NKWD überwacht das Projekt genau."
 BETnews.64.a:0 "Das könnte nach hinten losgehen"
 BETnews.64.b:0 "Ein Mann, der weiß, was getan werden muss"
 BETnews.65.name:0 "Mannerheim mobilisiert gegen BETs"
 BETnews.65.desc:0 "Feldmarschall Carl Gustaf Emil Mannerheim hat alle wehrfähigen Finnen aufgerufen, sich an der Verteidigung gegen eine BETA-Invasion aus der Sowjetunion zu beteiligen. Die Entschlossenheit der Nation wird einmal mehr auf die Probe gestellt."
 BETnews.65.a:0 "Wir werden das Heimatland verteidigen"
 BETnews.66.name:0 "Die neue Direktive von Regent Horthy"
 BETnews.66.desc:0 "Regent Miklós Horthy hat eine Direktive zur Verstärkung der ungarischen Grenzen und zur Vorbereitung auf einen möglichen BETA-Ausbruch erlassen. Das Land mobilisiert seine Kräfte und Ressourcen."
 BETnews.66.a:0 "Wir sollten uns auf die innere Stabilität konzentrieren."
 BETnews.66.b:0 "Eine gute Entscheidung."
 BETnews.67.name:0 "Reza Schahs Militärmobilisierung"
 BETnews.67.desc:0 "Reza Schah Pahlavi hat die Mobilisierung der persischen Armee angeordnet, um die Nation vor der sich aus dem Osten ausbreitenden BETA-Bedrohung zu schützen. Die Regierung ergreift alle notwendigen Vorsichtsmaßnahmen, um diese Gefahr zu besiegen."
 BETnews.67.a:0 "Mobilisieren Sie die Armee."
 BETnews.67.b:0 "Vielleicht gewinnen sie."
 BETnews.68.name:0 "Schweden schließt Grenzen und beschuldigt Deutschland für das BETA-Virus"
 BETnews.68.desc:0 "Als Reaktion auf die zunehmende BETA-Bedrohung hat Schweden seine Grenzen geschlossen und Deutschland für die Entwicklung des Virus verantwortlich gemacht. Ministerpräsident Per Albin Hansson hat zur nationalen Einheit und Wachsamkeit aufgerufen, um das Land vor der untoten Bedrohung zu schützen."
 BETnews.68.a:0 "Eine gute Nachricht"
 BETnews.68.b:0 "Wie können sie es wagen?!"
 BETnews.69.name:0 "Indien fällt der BETA-Bedrohung zum Opfer"
 BETnews.69.desc:0 "Berichte haben das Schlimmste bestätigt: Indien ist vollständig von BETs überrannt worden. Die Welt schaut entsetzt zu, wie die einst so pulsierende Nation in Chaos und Zerstörung versinkt. Regierungen auf der ganzen Welt sind nun in höchster Alarmbereitschaft, da sie die Ausbreitung der Untoten über Indiens Grenzen hinaus befürchten."
 BETnews.69.a:0 "Betrauert unsere Verluste. Wir müssen auf das Schlimmste vorbereitet sein."
 BETnews.70.name:0 "Sowjetunion fällt der BETA-Bedrohung zum Opfer"
 BETnews.70.desc:0 "Berichte haben das Schlimmste bestätigt: Die Sowjetunion ist vollständig von BETs überrannt worden. Die Welt sieht mit Schrecken, wie die einst mächtige Nation in Chaos und Zerstörung versinkt. Die Regierungen auf der ganzen Welt sind nun in höchster Alarmbereitschaft, da sie eine Ausbreitung der Untoten über die sowjetischen Grenzen hinaus befürchten."

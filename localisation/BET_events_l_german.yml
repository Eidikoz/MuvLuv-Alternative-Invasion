l_german:
 BETvereinigung.1.name:0 "Vereinigung gegen einen gemeinsamen Feind"
 BETvereinigung.1.desc:0 "England bietet euch einen Platz in der AntiBET-Allianz. Sie hoffen mit eurer Unterstützung die Vernichtung eines gemeinsamen Feindes zu erreichen."
 BETvereinigung.a:0"Ja, wir unterstützen euch."
 BETvereinigung.b:0"Wir brauchen euch nicht."
 BETnews.1.name:0"Geschenk für den Führer."
 BETnews.1.desc:0"Dieses Jahr zum Geburtstag des Führers zeigte sich Himmler besonders einfallreich. Anstatt eines regulären Geschenks brachte er dem Führer einen lebenden Untoten mit."
 BETnews.1.a:0"Ein wunderbares Geschenk."
 BETnews.2.name:0"Duce bekämpft Untoten."
 BETnews.2.desc:0"Unser glorreicher Anführer Benito Mussolini hat wieder einmal seine Männlichkeit bewiesen. Er kämpfte auf offener Straße mit einem Untoten und bezwang ihn."
 BETnews.2.a:0"Was für ein Held."
 BETnews.3.name:0"Göring verlor BETA."
 BETnews.3.desc:0"Göring hatte schon oft Fehler gemacht, aber dies schlägt dem Fass den Boden aus. Ihm ist sein HausBET entkommen. Man kann nur hoffen, dass es bald gefangen wird."
 BETnews.3.a:0"Dieser Idiot."
 BETnews.4.name:0"Görings BETs sind los!"
 BETnews.4.desc:0"Das BETA, dass Göring entkommen ist, hat etliche Deutsche infiziert."
 BETnews.4.a:0"Hoffentlich kann die Wehrmacht sie stoppen."
 BETnews.5.name:0"Japaner wollen KampfBET erschaffen."
 BETnews.5.desc:0"Das Japanische Königreich überlegt KampfBETs für den Kampf zu züchten. Dies könnte die größte Gefahr in der Geschichte der Menschheit werden."
 BETnews.5.a:0"Sind sie verrückt?"
 BETnews.5.b:0"Gut, gut."
 BETnews.6.name:0"Die erste Phase unseres Projekts wurde abgeschlossen."
 BETnews.6.desc:0"Wir verstehen nun die Grundfunktionen eines BETs. Außerdem konnten erste erfolgreiche Tests durchgeführt werden, ein BETA zu kontrollieren."
 BETnews.6.a:0"Wahrlich gute Nachrichten."
 BETnews.7.name:0"Beginn der zweiten Phase?"
 BETnews.7.desc:0"Unsere Wissenschaftler sind sich nun sicher, ein BETA kontrollieren zu können. Sollen wir ihnen die Erlaubnis dazu geben?"
 BETnews.7.a:0"Natürlich."
 BETnews.7.b:0"Nein, die kaiserliche Armee benötigt keine BETA um Kriege zu gewinnen."
 BETnews.8.name:0"BETausbruch aus größtem Labor Japans"
 BETnews.8.desc:0"Etlich BETs sind aus dem wichtigsten Labor entwischt. Dennoch sind die Behörden zuversichtlich sie fangen zu können."
 BETnews.8.a:0"Das könnte noch ein Problem werden."
 BETnews.9.name:0"Indische Verteidigung."
 BETnews.9.desc:0"Nachdem das indische Heer es nicht geschafft hat, die BETbedrohung einzudämmen, haben die Inder nun Milizen zum Schutz ihres Landes gebildet."
 BETnews.9.a:0"Hoffentlich können sie diese Gefahr besiegen."
 BETnews.10.name:0"Schlimmster Feind in der Geschichte Großbritanniens?"
 BETnews.10.desc:0"Heute hat der Erster Lord der Admiralität Winston Churchill bekannt gegeben, dass BETs der schlimmste Feind seien, dem die Briten je gegenübertreten mussten. Er ruft das Land an, Ruhe zu bewahren und bei der Vorbereitung für den Krieg zu helfen."
 BETnews.10.a:0"Interessant."
 BETnews.11.name:0"Franco setzt BETs im Bürgerkrieg ein."
 BETnews.11.desc:0"Franco, Anführer der Faschisten in Spanien, hat BETs im Großraum Madrids freigelassen. Dies soll seinen Soldaten helfen, den Bürgerkrieg zu gewinnen."
 BETnews.11.a:0"Ob das eine gute Idee ist?"
 BETnews.12.name:0"Stalin ruft zum großen AntiBETkrieg auf."
 BETnews.12.desc:0"Heute hat Stalin bekannt gegeben, dass sich die Soviet Union der BETplage annehmen wird. Er hat alle Russen aufgerufen ihren Beitrag in diesem großen Krieg zu leisten."
 BETnews.12.a:0"Okay."
 BETnews.13.name:0"Widerstand in überrannten Gebieten"
 BETnews.13.desc:0"Zivilisten haben in einem von BETs kontrollierten Staat Widerstand geleistet und viele BETs getötet."
 BETnews.13.a:0"Helden der Menschheit."
 BETnews.14.name:0"Widerstand in überrannten Gebieten"
 BETnews.14.desc:0"Einigen Zivilisten ist es heute gelungen, tausende BETs in eine Falle zu locken und sie auszulöschen."
 BETnews.15.name:0"Widerstand in überrannten Gebieten"
 BETnews.15.desc:0"Einige Zivilisten haben sich in einem Gebäude verschanzt. Sie konnten tausende BETs töten bevor sie selbst starben."
 BETnews.16.name:0"Widerstand in überrannten Gebieten"
 BETnews.16.desc:0"Zivilisten in besetzten Gebieten haben damit begonnen, Minen auszulegen und haben damit tausende BETs getötet."
 BETnews.17.name:0 "Totaler Krieg gegen BETs, ohne Rücksicht auf Verluste"
 BETnews.17.desc:0 "Heute hat ZCOM bekannt gegeben, dass sie einen Krieg gegen die BETs starten werden, wie die Welt noch keinen gesehen hat. Außerdem haben sie alle BETgebiet zu ihren Territorien erklärt." 
 BETnews.17.a:0 "Verrückt" 
 BETnews.18.name:0 "Hilfsprogramm"
 BETnews.18.desc:0 "ZCOM hat heute ein großes Hilfprojekt gestartet, um Länder in ihrem Kampf gegen die BETs zu unterstützen." 
 BETnews.18.a:0 "Toll" 
 BETnews.19.name:0 "ZCOM"
 BETnews.19.desc:0 "Heute um 0900 hat die Führung ZCOMs bekannt gegeben, dass sie nicht mehr der Anti-BETA Allianz angehören. Stattdessen wollen sie einen eigenen, nach ihren Worten "effizenteren" Krieg führen." 
 BETnews.19.a:0 "Wie können sie nur? Wir haben sie finanziert."
 BETnews.20.name:0 "Doomsday-Division"
 BETnews.20.desc:0 "Die aufziehende BETbedrohung hat die Mächte dieser Welt veranlasst, die 'Doomsday-Division' und eine Unterabteilung, 'ZCOM', zu gründen. Diese neutrale Organisation soll die Mächte dieser Welt unterstützen, die BETs endlich effektiv zu bekämpfen."
 BETnews.20.a:0 "Eine großartige Initiative."
 BETnews.21.name:0 "BETs in England"
 BETnews.21.desc:0 "Heute sind einige BETs an die Küste Englands gespült worden. Obwohl die Armee schnell reagierte, waren die BETs bereits verschwunden."
 BETnews.21.a:0 "Verdammt"
 BETnews.22.name:0 "BETs besiegt"
 BETnews.22.desc:0 "Heute konnte Großbritannien die letzten BETs ausfinding machen und vernichten. Damit ist Großbritannien vorerst gerettet."
 BETnews.22.a:0 "Ok"
 BETnews.23.name:0 "BETs infizierten große Teile der Bevölkerung Englands"
 BETnews.23.desc:0 "Die verloren gegangenen BETs haben große Teile der Bevölkerung infiziert und sind nun auf dem Vormarsch"
